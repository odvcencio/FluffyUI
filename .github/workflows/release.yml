name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic-version tag to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev libgl1-mesa-dev

      - name: Validate tag and vanity module path
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic versioning: ${RELEASE_TAG}" >&2
            exit 1
          fi
          test "$(git describe --tags --exact-match)" = "${RELEASE_TAG}"
          test "$(go list -m)" = "m31labs.dev/fluffyui"
          curl --fail --silent --show-error 'https://m31labs.dev/fluffyui?go-get=1' \
            | grep -F 'm31labs.dev/fluffyui git https://github.com/odvcencio/fluffyui'

      - name: Test, vet, and build
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build ./cmd/fluffy

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build fluffy
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "${GOOS}" = "windows" ]]; then ext=".exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o "fluffy-${GOOS}-${GOARCH}${ext}" ./cmd/fluffy

      - uses: actions/upload-artifact@v4
        with:
          name: fluffy-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
          path: fluffy-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum fluffy-* > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/fluffy-*
            artifacts/checksums.txt
          generate_release_notes: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify vanity-path install
        env:
          GOPROXY: direct
          GONOSUMDB: m31labs.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if go install "m31labs.dev/fluffyui/cmd/fluffy@${RELEASE_TAG}"; then
              fluffy --help >/dev/null
              exit 0
            fi
            sleep 10
          done
          exit 1
