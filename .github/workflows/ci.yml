name: ci

on:
  push:
  pull_request:

# Minimal CI: linux-only tests + staticcheck. macOS and Windows matrix
# dropped because of pre-existing platform-specific flakiness (unix socket
# path length on macOS, clock resolution and golden snapshots on Windows,
# Metal shader parser, gpu test timeout). Coverage and bench gates dropped
# as non-essential. Re-enable when we actually have users on other platforms.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libosmesa6-dev \
            libgl1-mesa-dev
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests
        run: go test ./...
      - name: Run tests with race detector
        run: go test -race ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run staticcheck
        run: staticcheck ./...
