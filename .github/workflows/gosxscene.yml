name: gosxscene

on:
  push:
    branches: [main]
    paths: [gosxscene/**]
  pull_request:
    paths: [gosxscene/**]

concurrency:
  group: gosxscene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gosxscene
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
